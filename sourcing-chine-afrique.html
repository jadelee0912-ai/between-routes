    <!-- Analytics : remplacez les 2 IDs ci-dessous puis redéployez.   -->

    <!--   META_PIXEL_ID: Meta/Facebook Pixel (15-16 chiffres)          -->

    <!-- ============================================================= -->
    <script>
      (function () {
        var GA4_ID = "G-DPZP6NSQQM";
        var META_PIXEL_ID = "1409081806389133";

        var hasGA = GA4_ID && GA4_ID.indexOf("XXXX") === -1;
        var hasPixel = META_PIXEL_ID && META_PIXEL_ID.indexOf("XXXX") === -1;

        // Google Analytics 4
        if (hasGA) {
          var g = document.createElement("script");
          g.async = true;
          g.src = "https://www.googletagmanager.com/gtag/js?id=" + GA4_ID;
          document.head.appendChild(g);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag("js", new Date());
          window.gtag("config", GA4_ID);
        }

        // Meta (Facebook) Pixel
        if (hasPixel) {
          !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0";
            n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
            s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
          }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
          window.fbq("init", META_PIXEL_ID);
          window.fbq("track", "PageView");
        }

        // Unified event helper used by the page. No-ops if no tag is loaded.
        // Maps key actions to Meta standard events for ad optimization.
        var STD = { whatsapp_click: "Contact", lead_form_submit: "Lead" };
        window.brTrack = function (name, params) {
          params = params || {};
          try { if (window.gtag) window.gtag("event", name, params); } catch (e) {}
          try {
            if (window.fbq) {
              if (STD[name]) window.fbq("track", STD[name], params);
              else window.fbq("trackCustom", name, params);
            }
          } catch (e) {}
        };
      })();
    </script>
